# Perfil dos testes de integração (ver IntegrationTest)

# Sem chamadas a serviços externos
app.geocoding.enabled=false
app.routing.enabled=false
# Conta de demonstração: loja, cardápio, associação, entregador e faturas para os testes de integração
app.demo.enabled=true

# Os jobs agendados só rodam quando o teste chama o método
app.delivery.offer-check-ms=3600000
app.delivery.retry-ms=3600000
app.delivery.route-planning-ms=3600000
app.delivery.stale-shift-check-ms=3600000
app.orders.expiration-check-ms=3600000

app.upload.dir=${java.io.tmpdir}/openbag-test-uploads
spring.jpa.show-sql=false
logging.level.com.openbag=INFO
logging.level.org.springframework.security=WARN
app.delivery.offer-check-initial-delay-ms=3600000
app.delivery.retry-initial-delay-ms=3600000
app.delivery.stale-shift-initial-delay-ms=3600000
app.delivery.route-planning-initial-delay-ms=3600000
app.orders.expiration-initial-delay-ms=3600000
# Contadores do limite de requisições só desta execução (se houver um Redis local, nada vaza entre execuções)
app.rate-limit.key-prefix=test-${random.uuid}:
