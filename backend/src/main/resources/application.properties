# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/openbag
spring.datasource.username=openbag
spring.datasource.password=openbag123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# schema.sql cria a extensão PostGIS antes do Hibernate criar as tabelas
spring.sql.init.mode=always

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000ms

# Elasticsearch Configuration
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=10s
spring.elasticsearch.socket-timeout=30s

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Origens do app web aceitas pelo CORS e pelo WebSocket, separadas por vírgula.
# Em desenvolvimento, qualquer porta do localhost (o flutter run muda a porta); em produção, OPENBAG_CORS_ORIGINS
app.cors.allowed-origins=${OPENBAG_CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# JWT Configuration
# HMAC-SHA exige chave de pelo menos 256 bits (32 bytes). O valor padrão é só de desenvolvimento:
# o perfil prod exige OPENBAG_JWT_SECRET e o SecretsValidator recusa este valor
app.jwt.secret=${OPENBAG_JWT_SECRET:openBagDevSecretKey2024-change-me-in-production!@#$%}
app.jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# Fuso dos restaurantes (horário de funcionamento, pausas e prazos de aceite)
app.timezone=America/Sao_Paulo

# Carrega coleções lazy em lote (evita N+1 ao montar o cardápio)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ADMIN inicial (criado na inicialização somente se não existir nenhum ADMIN)
# A senha padrão é só de desenvolvimento; o perfil prod a recusa
app.admin.email=${OPENBAG_ADMIN_EMAIL:admin@openbag.local}
app.admin.password=${OPENBAG_ADMIN_PASSWORD:admin123}

# Roteamento pelas ruas (caminho das rotas no mapa). O padrão é o servidor público de demonstração
# do OSRM, só para desenvolvimento; em produção, aponte para um OSRM próprio
app.routing.osrm-url=${OPENBAG_OSRM_URL:https://router.project-osrm.org}
app.routing.enabled=${OPENBAG_ROUTING_ENABLED:true}

# Coordenadas do endereço de entrega (distância da taxa por km e do despacho). O padrão é o Nominatim
# público do OpenStreetMap (1 consulta por segundo); em produção, aponte para um Nominatim próprio
app.geocoding.url=${OPENBAG_GEOCODING_URL:https://nominatim.openstreetmap.org}
app.geocoding.enabled=${OPENBAG_GEOCODING_ENABLED:true}

# Conta de demonstração com TODOS os perfis, inclusive ADMIN (demo@openbag.local / demo1234).
# Só para desenvolvimento: a senha é pública. Ligue com OPENBAG_DEMO_ENABLED=true
app.demo.enabled=${OPENBAG_DEMO_ENABLED:false}

# Logging Configuration
logging.level.com.openbag=DEBUG
logging.level.org.springframework.security=DEBUG

# OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
