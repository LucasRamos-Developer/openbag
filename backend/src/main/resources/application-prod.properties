# Perfil de produção. Não há valores padrão para segredos: sem as variáveis abaixo, o backend não sobe.
# O SecretsValidator também recusa segredos de desenvolvimento e a conta de demonstração.

# Banco: defina SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Segredo do JWT com pelo menos 32 bytes (ex.: openssl rand -base64 48)
app.jwt.secret=${OPENBAG_JWT_SECRET}

# ADMIN inicial: com a senha vazia, nenhum ADMIN é criado
app.admin.email=${OPENBAG_ADMIN_EMAIL:}
app.admin.password=${OPENBAG_ADMIN_PASSWORD:}

# Origens do app web, separadas por vírgula (ex.: https://openbag.app)
app.cors.allowed-origins=${OPENBAG_CORS_ORIGINS}

# Sem SQL nem DEBUG no log
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.com.openbag=INFO
logging.level.org.springframework.security=WARN

# Documentação da API só em desenvolvimento
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
