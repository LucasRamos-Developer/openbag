# Vulnerabilidades conhecidas nas dependências do backend (OWASP Dependency-Check), toda segunda-feira e sob demanda.
# Precisa do segredo NVD_API_KEY (chave gratuita em https://nvd.nist.gov/developers/request-an-api-key).
name: Dependências vulneráveis

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -Psecurity -DskipTests verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
