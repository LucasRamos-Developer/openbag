# Testes a cada push e pull request: backend (unitários e de integração, com Postgres + PostGIS e Redis em
# containers) e app Flutter (análise e testes).
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Os testes de integração usam Testcontainers (o Docker já vem no runner)
      - name: Testes
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Só erros quebram o build; os avisos antigos estão sendo resolvidos aos poucos
      - name: Análise
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Testes
        run: flutter test
