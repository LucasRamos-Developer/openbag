<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00A878">

  <!-- SEO: o app troca título, descrição e canônico em cada página (lib/utils/seo.dart).
       tools/seo/build_seo.py completa as URLs absolutas no build publicado. -->
  <meta name="description" content="Peça direto dos restaurantes e pequenos negócios da sua cidade, com entregadores locais e cooperativas. Cardápio, pedido e acompanhamento da entrega em um só lugar.">
  <link rel="canonical" href="/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OpenBag">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="OpenBag · Restaurantes e pequenos negócios da sua cidade">
  <meta property="og:description" content="Peça direto dos restaurantes da sua cidade, com entregadores locais e cooperativas.">
  <meta property="og:url" content="/">
  <meta property="og:image" content="og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Open Bag">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OpenBag · Restaurantes e pequenos negócios da sua cidade</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading screen */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      /* Tema padrão Fresh Green (frontend/lib/core/ui/theme/app_theme_presets.dart) */
      background: #F7FAF8;
      color: #17221D;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .loading-logo {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    .loading-logo span {
      color: #00A878;
    }

    .loading-text {
      font-size: 1.2rem;
      color: #5B6660;
      margin-bottom: 2rem;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #DDF4EC;
      border-top: 4px solid #00A878;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Hide loading when Flutter app loads */
    flutter-view {
      display: block;
    }

    #loading.loaded {
      display: none;
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="loading-logo">Open<span>Bag</span></div>
    <div class="loading-text">Carregando os restaurantes da sua cidade...</div>
    <div class="spinner"></div>
  </div>
  <noscript>
    <h1>OpenBag</h1>
    <p>Peça direto dos restaurantes e pequenos negócios da sua cidade, com entregadores locais e cooperativas.
      Para ver os restaurantes e fazer o pedido, ative o JavaScript no navegador.</p>
  </noscript>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading').classList.add('loaded');
    });
  </script>

  <script>
    var serviceWorkerVersion = null;
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) {
        return;
      }
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    if ('serviceWorker' in navigator) {
      // Service workers are supported. Use them.
      window.addEventListener('load', function () {
        // Wait for registration to finish before dropping the <script> tag.
        // Otherwise, the browser will load the script multiple times,
        // potentially different versions.
        var serviceWorkerUrl = 'flutter_service_worker.js?v=' + serviceWorkerVersion;
        navigator.serviceWorker.register(serviceWorkerUrl)
          .then((reg) => {
            function waitForActivation(serviceWorker) {
              serviceWorker.addEventListener('statechange', () => {
                if (serviceWorker.state == 'activated') {
                  console.log('Installed new service worker.');
                  loadMainDartJs();
                }
              });
            }
            if (!reg.active && (reg.installing || reg.waiting)) {
              // No active web worker and we have installed or are installing
              // one for the first time. Simply wait for it to activate.
              waitForActivation(reg.installing || reg.waiting);
            } else if (!reg.active.scriptURL.endsWith(serviceWorkerVersion)) {
              // When the app updates the serviceWorkerVersion changes, so we
              // need to ask the service worker to update.
              console.log('New service worker available.');
              reg.update();
              waitForActivation(reg.installing);
            } else {
              // Existing service worker is still good.
              console.log('Loading app from service worker.');
              loadMainDartJs();
            }
          });

        // If service worker doesn't succeed in a reasonable amount of time,
        // fallback to plaint <script> tag.
        setTimeout(() => {
          if (!scriptLoaded) {
            console.warn(
              'Failed to load app from service worker. Falling back to plain <script> tag.',
            );
            loadMainDartJs();
          }
        }, 4000);
      });
    } else {
      // Service workers not supported. Just drop the <script> tag.
      loadMainDartJs();
    }
  </script>
</body>
</html>
